name: Build Native Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2022
            type: msi
            label: Windows (msi)
            artifact: Kaantaa-windows
          - os: macos-14
            type: dmg
            label: macOS (dmg)
            artifact: Kaantaa-macos
          - os: ubuntu-22.04
            type: deb
            label: Linux (deb)
            artifact: Kaantaa-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress

      - name: Install fakeroot (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot


      - name: Make gradlew executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew


      - name: Build fat JAR
        shell: bash
        run: ./gradlew fatJar --no-daemon --stacktrace

      - name: Package installer
        shell: bash
        run: ./gradlew packageApp -Ptype=${{ matrix.type }} --no-daemon --stacktrace


      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/jpackage/*.msi
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/jpackage/*.pkg
            build/jpackage/*.deb
            build/jpackage/*.rpm
          if-no-files-found: error
          retention-days: 14