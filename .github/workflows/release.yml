name: Build Native Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release notes (markdown). Leave blank to auto-generate.'
        required: false
        type: string
        default: ''
      winDirChooser:
        description: 'Windows: show "Choose install directory" dialog'
        required: false
        type: boolean
        default: true
      winShortcut:
        description: 'Windows: offer desktop shortcut'
        required: false
        type: boolean
        default: true
      winMenu:
        description: 'Windows: offer Start-menu shortcut'
        required: false
        type: boolean
        default: true
      winShortcutPrompt:
        description: 'Windows: show shortcut-prompt dialog (requires shortcut and/or menu)'
        required: false
        type: boolean
        default: true
      winPerUserInstall:
        description: 'Windows: install per-user (no admin prompt)'
        required: false
        type: boolean
        default: false
      linuxShortcut:
        description: 'Linux: create .desktop / application-menu shortcut'
        required: false
        type: boolean
        default: true
      installDir:
        description: 'Optional install dir. Absolute on Linux/macOS .pkg; relative sub-path on Windows. Blank = default.'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2022
            type: msi
            label: Windows (msi)
            artifact: Kaantaa-windows
          - os: macos-14
            type: dmg
            label: macOS (dmg)
            artifact: Kaantaa-macos
          - os: ubuntu-22.04
            type: deb
            label: Linux (deb)
            artifact: Kaantaa-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress

      - name: Install fakeroot (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot


      - name: Make gradlew executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew


      - name: Build fat JAR
        shell: bash
        run: ./gradlew fatJar --no-daemon --stacktrace

      - name: Package installer
        shell: bash
        run: |
          ./gradlew packageApp \
            -Ptype=${{ matrix.type }} \
            -PwinDirChooser=${{ inputs.winDirChooser }} \
            -PwinShortcut=${{ inputs.winShortcut }} \
            -PwinMenu=${{ inputs.winMenu }} \
            -PwinShortcutPrompt=${{ inputs.winShortcutPrompt }} \
            -PwinPerUserInstall=${{ inputs.winPerUserInstall }} \
            -PlinuxShortcut=${{ inputs.linuxShortcut }} \
            -PinstallDir='${{ inputs.installDir }}' \
            --no-daemon --stacktrace

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/jpackage/*.msi
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/jpackage/*.pkg
            build/jpackage/*.deb
            build/jpackage/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List downloaded files (debug)
        run: find installers -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Kaantaa ${{ steps.meta.outputs.version }}
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          draft: false
          prerelease: false
          files: |
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.dmg
            installers/**/*.pkg
            installers/**/*.deb
            installers/**/*.rpm