plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'net.plat12'
version = '1.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'net.plat12.kaantaa.Launcher'
}


tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF'
}


tasks.register('packageApp', Exec) {
    dependsOn 'fatJar'

    def outputDir  = layout.buildDirectory.dir('jpackage').get().asFile
    def stagingDir = layout.buildDirectory.dir('jpackage-input').get().asFile
    def appName    = 'Kaantaa'
    def mainJar    = tasks.fatJar.archiveFile.get().asFile.name
    def jpackage   = "${System.getProperty('java.home')}/bin/jpackage"
    def pkgType    = project.findProperty('type') ?: 'app-image'
    def os         = org.gradle.internal.os.OperatingSystem.current()

    def winDirChooser     = (project.findProperty('winDirChooser')     ?: 'true')
    def winShortcut       = (project.findProperty('winShortcut')       ?: 'true')
    def winMenu           = (project.findProperty('winMenu')           ?: 'true')
    def winShortcutPrompt = (project.findProperty('winShortcutPrompt') ?: 'true')
    def winPerUserInstall = (project.findProperty('winPerUserInstall') ?: 'false')
    def linuxShortcut     = (project.findProperty('linuxShortcut')     ?: 'true')
    def installDir        = project.findProperty('installDir')

    inputs.file tasks.fatJar.archiveFile
    outputs.dir outputDir

    doFirst {
        delete outputDir, stagingDir
        stagingDir.mkdirs()
        copy {
            from tasks.fatJar.archiveFile
            into stagingDir
        }
    }

    def args = [
            jpackage,
            '--input',        stagingDir.absolutePath,
            '--dest',         outputDir.absolutePath,
            '--name',         appName,
            '--main-jar',     mainJar,
            '--main-class',   application.mainClass.get(),
            '--type',         pkgType,
            '--app-version',  project.version.toString(),
            '--vendor',       'Plat12',
            '--description',  'Kaantaa',
            '--java-options', '--add-exports=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED'
    ]


    if (installDir) {
        args += ['--install-dir', installDir.toString()]
    }

    if (os.isWindows() && pkgType != 'app-image') {
        if (winDirChooser.toBoolean())     args += '--win-dir-chooser'
        if (winShortcut.toBoolean())       args += '--win-shortcut'
        if (winMenu.toBoolean())           args += '--win-menu'
        if (winShortcutPrompt.toBoolean()) args += '--win-shortcut-prompt'
        if (winPerUserInstall.toBoolean()) args += '--win-per-user-install'
    }

    if (os.isLinux() && pkgType != 'app-image') {
        if (linuxShortcut.toBoolean()) args += '--linux-shortcut'
    }

    commandLine = args
}

tasks.named('build') {
    finalizedBy 'packageApp'
}

tasks.register('dist') {
    dependsOn 'packageApp'
}